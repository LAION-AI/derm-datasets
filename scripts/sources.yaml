# Journals: per-article licence is detected from the article HTML (see
# 11_ingest_journals.py). Articles with a detected Creative Commons licence get
# release_tier = open (subject to the exact CC variant); all others = metadata
# (DOI + figure number + derived labels, no image, no verbatim caption).

