# Source registry: provenance + licence + release policy per source.
# Licence facts were checked on 2026-10-12 against the live sites or Wayback
# snapshots (URLs in `terms_url`). This is a documentation aid, not legal advice.
#
# release_tier:
#   open        - images + text may be redistributed under the stated licence
#   metadata    - only identifiers, URLs (or archive URLs), hashes and derived
#                 annotations may be published; images and verbatim text stay internal
#   internal    - nothing beyond aggregate statistics is published
# All tiers are kept in the internal research copy (dataset/), which may only be
# shared within a defined research group (§60d UrhG / Art. 3 DSM Directive).

altmeyers:
  name: Altmeyers Enzyklopädie
  type: atlas
  url: https://www.altmeyers.org
  owner: EMG GmbH & Co. KG, Berlin
  license: "© EMG GmbH & Co. KG - all rights reserved; non-commercial one-time low-res use after e-mail notice; images must keep watermark"
  terms_url: https://www.altmeyers.org/en/licensing
  ai_training_clause: not stated
  release_tier: metadata
  publish_url: true
  notes: watermark must not be removed -> restored (inpainted) variants are internal only

